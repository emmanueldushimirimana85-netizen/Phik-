<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHIK</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#09090b">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        phik: { 500: '#6366f1', 600: '#4f46e5', dark: '#09090b', card: '#121215', border: '#27272a' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #09090b; color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- TOP HEADER BAR -->
    <header class="flex items-center justify-between px-4 py-3 bg-phik-dark border-b border-phik-border shrink-0 z-30">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-black tracking-wider bg-gradient-to-r from-indigo-500 to-purple-500 bg-clip-text text-transparent">PHIK</span>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="app.switchTab('alerts')" class="relative text-zinc-300 hover:text-white p-1">
                <i class="fa-regular fa-bell text-xl"></i>
                <span id="unread-badge" class="absolute top-0 right-0 w-2 h-2 bg-indigo-500 rounded-full hidden"></span>
            </button>
            <button onclick="app.switchTab('messages')" class="text-zinc-300 hover:text-white p-1">
                <i class="fa-regular fa-comment-dots text-xl"></i>
            </button>
        </div>
    </header>

    <!-- TOP FEED SWITCHER (For Home tab) -->
    <div id="top-feed-switcher" class="flex items-center justify-center space-x-6 py-2 bg-phik-dark border-b border-phik-border shrink-0 z-20">
        <button onclick="app.switchFeedTab('for-you')" id="tab-for-you" class="text-sm font-bold text-white border-b-2 border-indigo-500 pb-1">For You</button>
        <button onclick="app.switchFeedTab('trending')" id="tab-trending" class="text-sm font-medium text-zinc-400 pb-1">Trending</button>
    </div>

    <!-- MAIN APP VIEW CONTAINER -->
    <main id="app-content" class="flex-1 overflow-y-auto relative pb-20">
        <!-- Dynamic views rendered via JS -->
    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-phik-dark border-t border-phik-border flex items-center justify-around px-2 z-30">
        <button onclick="app.switchTab('home')" id="nav-home" class="flex flex-col items-center justify-center flex-1 text-indigo-500">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Home</span>
        </button>
        <button onclick="app.switchTab('reels')" id="nav-reels" class="flex flex-col items-center justify-center flex-1 text-zinc-400 hover:text-white">
            <i class="fa-solid fa-clapperboard text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Reels</span>
        </button>
        <button onclick="app.openCreateModal()" class="flex items-center justify-center w-11 h-11 bg-indigo-600 rounded-full text-white shadow-lg shadow-indigo-500/30 transform active:scale-95 transition">
            <i class="fa-solid fa-plus text-lg"></i>
        </button>
        <button onclick="app.switchTab('shop')" id="nav-shop" class="flex flex-col items-center justify-center flex-1 text-zinc-400 hover:text-white">
            <i class="fa-solid fa-bag-shopping text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">My Shop</span>
        </button>
        <button onclick="app.switchTab('profile')" id="nav-profile" class="flex flex-col items-center justify-center flex-1 text-zinc-400 hover:text-white">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Profile</span>
        </button>
    </nav>

    <!-- CORE SCRIPT LOADER -->
    <script src="features.js"></script>
</body>
</html>
