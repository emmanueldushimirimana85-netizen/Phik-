<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHIK</title>
<style>
:root{--bg:#fff;--ink:#0F1419;--mute:#536471;--line:#EFF3F4;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#E7E9EA;--mute:#71767B;--line:#2F3336;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:env(safe-area-inset-top,0px) 0 96px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--ink)}.hide{display:none!important}.mute{color:var(--mute)}
.sb{width:100%;margin-bottom:10px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.big{width:100%;padding:13px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;margin:4px 0 10px}.big:disabled{opacity:.5}
.logo{width:34px;height:34px;border-radius:11px;background:var(--ink);color:var(--bg);font-weight:800;display:grid;place-items:center}
.wrap{padding:60px 22px;text-align:center}.wrap .logo{width:60px;height:60px;font-size:28px;margin:0 auto 12px}.wrap p{margin:10px 0}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line);z-index:5}
.title{font-weight:800;font-size:20px;letter-spacing:.04em}
.av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;flex:none;object-fit:cover;overflow:hidden}
.ht{display:flex;border-bottom:1px solid var(--line);position:sticky;top:calc(55px + env(safe-area-inset-top,0px));background:var(--bg);z-index:4}
.ht button{flex:1;padding:13px 0;color:var(--mute);font-weight:600}.ht button.on{color:var(--ink);font-weight:800;box-shadow:inset 0 -3px 0 var(--ink)}
.sub{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px}.sub button{font-size:18px}
.post{border-bottom:1px solid var(--line);padding:12px 0}
.ph{display:flex;align-items:center;gap:10px;padding:0 12px 8px}.who{flex:1;min-width:0;line-height:1.3;cursor:pointer}.who small{color:var(--mute);display:block}
.pill{padding:6px 12px;border-radius:99px;border:1.5px solid var(--ink);font-weight:600;font-size:12px}.pill.on{background:var(--ink);color:var(--bg)}
.cap{padding:0 12px 10px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.media{position:relative}.media img,.media video{width:100%;max-height:520px;object-fit:cover;display:block;background:var(--line)}.media audio{width:100%}
.price{position:absolute;right:10px;bottom:10px;background:var(--bg);color:var(--ink);font-weight:800;padding:5px 11px;border-radius:99px}
.act{display:flex;align-items:center;gap:2px;padding:8px 6px 0}.act button{padding:7px 10px;border-radius:99px}.act button.on{background:var(--line);font-weight:700}
.buy{margin-left:auto;background:var(--ink);color:var(--bg)!important;font-weight:800}
.empty{padding:50px 24px;text-align:center;color:var(--mute);line-height:1.6}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;font-size:11px;color:var(--mute);display:grid;gap:2px;justify-items:center;position:relative}nav button span{font-size:22px}nav button.on{color:var(--ink);font-weight:700}
nav .plus{flex:none;width:54px;height:54px;border-radius:18px;margin-top:-26px;background:var(--ink);color:var(--bg);font-size:30px;display:grid;place-items:center}
.bdg{position:absolute;top:-4px;left:calc(50% + 4px);background:var(--ink);color:var(--bg);border-radius:99px;font-size:10px;padding:1px 6px;font-weight:800}
.sheet{position:fixed;inset:0;background:#0009;z-index:9;display:none;align-items:flex-end;justify-content:center}.sheet.show{display:flex}
.in{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}.in h3{margin-bottom:12px}
#drawer{justify-content:flex-start;align-items:stretch}#drawer .in{width:78%;max-width:320px;border-radius:0 24px 24px 0;max-height:none;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;font-size:17px;font-weight:700;text-align:left}.mi em{font-style:normal;width:28px;text-align:center}
.cm{padding:9px 0;border-bottom:1px solid var(--line);line-height:1.45}
.pad{padding:14px}.stat{display:flex;gap:10px;margin:12px 0}.stat div{flex:1;border:1px solid var(--line);border-radius:14px;padding:10px}.stat b{display:block;font-size:18px}.stat small{color:var(--mute)}
.cover{height:90px;background:var(--line)}.pr{display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px;margin-top:-36px}.pr .av{width:76px;height:76px;font-size:30px;border:4px solid var(--bg)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}.row .t{flex:1;min-width:0}.row .t small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.un .t b{font-weight:900}.dot{width:10px;height:10px;border-radius:50%;background:var(--ink);flex:none}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;margin-bottom:6px;line-height:1.4;word-wrap:break-word}.bub.me{margin-left:auto;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}.bub.th{background:var(--line);border-bottom-left-radius:4px}
details{border-bottom:1px solid var(--line);padding:12px 2px;line-height:1.55}summary{font-weight:700}details p{color:var(--mute);margin-top:6px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}.toast.show{opacity:1}
</style>
</head>
<body>

<div id="auth" class="wrap hide">
  <div class="logo">K</div><h1>PHIK</h1>
  <p class="mute" id="atag">Log in to continue</p>
  <input id="dn" class="sb hide" placeholder="Your name">
  <input id="em" class="sb" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" class="sb" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
  <button class="big" id="abtn" onclick="authGo()">Log in</button>
  <p><a href="#" id="alink" onclick="swap();return false">Create an account</a></p>
  <p id="amsg" class="mute"></p>
  <p class="mute" style="font-size:12px">By continuing you agree to the Terms and Privacy Policy.</p>
</div>

<div id="app" class="hide">
  <header>
    <button id="hav" onclick="openDrawer()"></button>
    <div class="title">PHIK</div>
    <span style="width:38px"></span>
  </header>
  <main id="view"></main>
  <nav>
    <button data-t="home" class="on"><span>🏠</span>Home</button>
    <button data-t="search"><span>🔍</span>Search</button>
    <button class="plus" onclick="openDrop()">+</button>
    <button data-t="alerts"><span>🔔</span>Alerts<i class="bdg hide" id="bn">0</i></button>
    <button data-t="msgs"><span>💌</span>Messages<i class="bdg hide" id="bm">0</i></button>
  </nav>
</div>

<div class="sheet" id="drawer" onclick="if(event.target===this)closeSheets()"><div class="in" id="dbody"></div></div>

<div class="sheet" id="dsheet" onclick="if(event.target===this)closeSheets()"><div class="in">
  <h3>Drop something</h3>
  <select id="dk" class="sb" onchange="kindChange()">
    <option value="text">💬 Text post</option><option value="photo">📷 Photo</option><option value="video">🎥 Video</option>
    <option value="reel">🎞️ Reel</option><option value="music">🎵 Music track</option><option value="product">🏷️ Product for sale</option>
  </select>
  <textarea id="dc" class="sb" rows="3" maxlength="2000" placeholder="What is new?"></textarea>
  <input id="dp" class="sb hide" type="number" min="0" step="0.01" placeholder="Price in USD">
  <input id="df" class="sb" type="file" accept="image/*,video/*,audio/*">
  <button class="big" id="dbtn" onclick="dropGo()">Drop it</button>
</div></div>

<div class="sheet" id="csheet" onclick="if(event.target===this)closeSheets()"><div class="in">
  <h3>Comments</h3><div id="clist"></div>
  <div style="display:flex;gap:8px;margin-top:12px"><input id="cin" class="sb" style="margin:0" maxlength="1000" placeholder="Add a comment"><button class="pill on" onclick="addC()">Post</button></div>
</div></div>

<div class="sheet" id="esheet" onclick="if(event.target===this)closeSheets()"><div class="in">
  <h3>Edit profile</h3>
  <p class="mute" style="margin-bottom:6px">Profile picture</p>
  <input id="ef" class="sb" type="file" accept="image/*">
  <input id="en" class="sb" maxlength="60" placeholder="Name">
  <input id="eu" class="sb" maxlength="30" placeholder="Username">
  <textarea id="eb" class="sb" rows="3" maxlength="300" placeholder="Bio"></textarea>
  <button class="big" id="ebtn" onclick="saveEdit()">Save</button>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SB_URL='https://zlooiujusjowetqqkikx.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsb29pdWp1c2pvd2V0cXFraWt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMjkyNjcsImV4cCI6MjEwODcwNTI2N30.IPIvvI82cFNgru-thEmeYb0NPOnhYWYNAhyhudV5mzw';
var sb=supabase.createClient(SB_URL,SB_KEY);
var me=null,prof=null,follows=new Set(),myLikes={},posts=[],ptarget='#plist',stack=[['home']],homeTab='foryou',cpost=null,signup=false,unreadN=0,unreadM=0,stimer=null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(function(){t.classList.remove('show')},2400)}
function msg(m){$('#amsg').textContent=m}
function ago(t){var s=(Date.now()-new Date(t))/1000;if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'}
function avHtml(p,sz){var n=(p&&(p.display_name||p.username))||'?',st=sz?`style="width:${sz}px;height:${sz}px"`:'';
  if(p&&p.avatar_url&&p.avatar_url.indexOf(SB_URL)===0)return `<img class="av" ${st} src="${esc(p.avatar_url)}" alt="">`;
  return `<div class="av" ${st}>${esc(n[0]).toUpperCase()}</div>`}
function cv(){return stack[stack.length-1][0]}

/* ---------- auth ---------- */
function swap(){signup=!signup;$('#dn').classList.toggle('hide',!signup);$('#abtn').textContent=signup?'Create account':'Log in';$('#atag').textContent=signup?'Create your PHIK account':'Log in to continue';$('#alink').textContent=signup?'I already have an account':'Create an account';$('#pw').autocomplete=signup?'new-password':'current-password';msg('')}
async function authGo(){
  var email=$('#em').value.trim(),password=$('#pw').value;
  if(!email||password.length<8){msg('Enter your email and a password of 8 or more characters.');return}
  $('#abtn').disabled=true;msg('');
  try{
    if(signup){
      var r=await sb.auth.signUp({email:email,password:password,options:{data:{display_name:$('#dn').value.trim()||undefined},emailRedirectTo:location.origin+location.pathname}});
      if(r.error)throw r.error;
      if(!r.data.session){swap();msg('Almost done. Open the email we sent you and tap the confirmation link, then log in.')}
    }else{
      var r2=await sb.auth.signInWithPassword({email:email,password:password});
      if(r2.error)throw r2.error;
    }
  }catch(e){msg(e.message||'Something went wrong. Try again.')}
  $('#abtn').disabled=false;
}
async function logout(){closeSheets();sb.removeAllChannels();me=null;await sb.auth.signOut()}
sb.auth.onAuthStateChange(function(ev,s){setTimeout(function(){boot(s)},0)});
async function boot(s){
  if(!s){me=null;$('#app').classList.add('hide');$('#auth').classList.remove('hide');return}
  if(me&&me.id===s.user.id)return;
  me=s.user;
  var res=await Promise.all([
    sb.from('profiles').select('*').eq('id',me.id).single(),
    sb.from('follows').select('following_id').eq('follower_id',me.id),
    sb.from('likes').select('post_id,value').eq('user_id',me.id)]);
  prof=res[0].data||{username:'you',display_name:'You',bio:''};
  follows=new Set((res[1].data||[]).map(function(r){return r.following_id}));
  myLikes={};(res[2].data||[]).forEach(function(r){myLikes[r.post_id]=r.value});
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');
  $('#hav').innerHTML=avHtml(prof);
  stack=[['home']];render();badges();subscribe();
}

/* ---------- realtime and badges ---------- */
function paint(){var a=$('#bn'),b=$('#bm');a.textContent=unreadN;b.textContent=unreadM;a.classList.toggle('hide',!unreadN);b.classList.toggle('hide',!unreadM)}
async function badges(){
  var r=await Promise.all([
    sb.from('notifications').select('*',{count:'exact',head:true}).eq('user_id',me.id).eq('is_read',false),
    sb.from('messages').select('*',{count:'exact',head:true}).eq('recipient_id',me.id).is('read_at',null)]);
  unreadN=r[0].count||0;unreadM=r[1].count||0;paint();
}
function subscribe(){
  sb.channel('rt-'+me.id)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient_id=eq.'+me.id},function(p){onMsg(p.new)})
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+me.id},function(){unreadN++;paint();if(cv()==='alerts')viewAlerts()})
   .subscribe();
}
function onMsg(m){
  var top=stack[stack.length-1];
  if(top[0]==='chat'&&top[1]===m.sender_id){addBub(m);markRead(m.sender_id);return}
  unreadM++;paint();if(top[0]==='msgs')viewMsgs();
}

/* ---------- navigation ---------- */
document.querySelectorAll('nav [data-t]').forEach(function(b){b.onclick=function(){setTab(b.dataset.t)}});
function setTab(t){stack=[[t]];render()}
function open(v,a){stack.push([v,a]);render()}
function back(){if(stack.length>1){stack.pop();render()}}
function openUser(id){open('user',id)}
function render(){
  var t=stack[stack.length-1],root=stack[0][0];
  document.querySelectorAll('nav [data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t===root)});
  window.scrollTo(0,0);
  ({home:viewHome,search:viewSearch,alerts:viewAlerts,msgs:viewMsgs,chat:viewChat,user:viewUser,policy:viewPolicy})[t[0]](t[1]);
}
function sub(title){return `<div class="sub">${stack.length>1?'<button onclick="back()">⬅️</button>':''}<span>${title}</span></div>`}

/* ---------- drawer ---------- */
function openDrawer(){
  var n=prof.display_name||prof.username;
  $('#dbody').innerHTML=`<div style="margin-bottom:14px">${avHtml(prof,52)}<div style="margin-top:8px;font-weight:800;font-size:17px">${esc(n)}${prof.is_verified?' ✅':''}</div><div class="mute">@${esc(prof.username)}</div></div>
  <button class="mi" onclick="drawGo('profile')"><em>👤</em>Profile</button>
  <button class="mi" onclick="drawGo('reel')"><em>🎬</em>Reels</button>
  <button class="mi" onclick="drawGo('shop')"><em>🛍️</em>My Shop</button>
  <button class="mi" onclick="drawGo('policy')"><em>📜</em>Policies and privacy</button>
  <button class="mi" onclick="logout()"><em>🚪</em>Log out</button>`;
  $('#drawer').classList.add('show');
}
function drawGo(w){
  closeSheets();
  if(w==='profile'){stack=[['user',me.id]];render()}
  else if(w==='policy'){stack=[['policy']];render()}
  else{homeTab=w;setTab('home')}
}
function closeSheets(){document.querySelectorAll('.sheet').forEach(function(s){s.classList.remove('show')})}

/* ---------- home feed ---------- */
function viewHome(){
  var tabs=[['foryou','For you'],['following','Following'],['reel','Reels'],['shop','Shop']];
  $('#view').innerHTML='<div class="ht">'+tabs.map(function(t){return `<button class="${homeTab===t[0]?'on':''}" onclick="homeTab='${t[0]}';viewHome()">${t[1]}</button>`}).join('')+'</div><div id="plist"></div>';
  loadFeed();
}
async function loadFeed(){
  ptarget='#plist';var box=$('#plist');
  if(homeTab==='following'&&!follows.size){posts=[];box.innerHTML='<div class="empty">You are not following anyone yet.<br>Use Search to find creators and tap Follow. 🔍</div>';return}
  box.innerHTML='<div class="empty">Loading…</div>';
  var q=sb.from('feed').select('*').order('created_at',{ascending:false}).limit(50);
  if(homeTab==='reel')q=q.in('kind',['reel','video']);
  if(homeTab==='shop')q=q.eq('kind','product');
  if(homeTab==='following')q=q.in('author_id',Array.from(follows));
  var r=await q;
  if(r.error){box.innerHTML='<div class="empty">Could not load posts. Check your connection and try again.</div>';return}
  posts=r.data||[];renderPosts();
}
function mediaHtml(p){
  var u=p.media_url;if(!u||u.indexOf(SB_URL)!==0)return '';
  var price=p.price_cents!=null?`<span class="price">$${(p.price_cents/100).toFixed(2)}</span>`:'';
  if(p.kind==='video'||p.kind==='reel')return `<div class="media"><video src="${esc(u)}" controls playsinline preload="metadata"></video>${price}</div>`;
  if(p.kind==='music')return `<div class="media"><audio src="${esc(u)}" controls></audio></div>`;
  return `<div class="media"><img src="${esc(u)}" alt="" loading="lazy">${price}</div>`;
}
function renderPosts(){
  var box=$(ptarget);if(!box)return;
  if(!posts.length){box.innerHTML='<div class="empty">Nothing here yet.<br>Tap <b>+</b> to drop a post. 🚀</div>';return}
  box.innerHTML=posts.map(function(p,i){
    var mine=p.author_id===me.id,v=myLikes[p.id],name=p.display_name||p.username;
    var priceOnly=(p.kind==='product'&&!p.media_url&&p.price_cents!=null)?`<div class="cap"><b>$${(p.price_cents/100).toFixed(2)}</b></div>`:'';
    var fol=follows.has(p.author_id);
    return `<article class="post"><div class="ph"><span onclick="openUser('${p.author_id}')">${avHtml(p)}</span>
    <div class="who" onclick="openUser('${p.author_id}')"><b>${esc(name)}${p.is_verified?' ✅':''}</b><small>@${esc(p.username)} · ${ago(p.created_at)}</small></div>
    ${mine?'':`<button class="pill${fol?' on':''}" onclick="toggleFollow('${p.author_id}')">${fol?'Following':'Follow'}</button>`}</div>
    ${p.caption?`<p class="cap">${esc(p.caption)}</p>`:''}${mediaHtml(p)}${priceOnly}
    <div class="act"><button class="${v===1?'on':''}" onclick="like(${i},1)">👍 ${p.like_count||0}</button>
    <button class="${v===-1?'on':''}" onclick="like(${i},-1)">👎</button>
    <button onclick="openC(${i})">💬 ${p.comment_count||0}</button>
    ${mine?`<button onclick="delPost(${i})">🗑️</button>`:''}
    ${p.kind==='product'?`<button class="buy" onclick="toast('Checkout is coming soon')">Buy now</button>`:''}</div></article>`}).join('');
}
async function toggleFollow(uid){
  var has=follows.has(uid),r;
  if(has)r=await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',uid);
  else r=await sb.from('follows').insert({follower_id:me.id,following_id:uid});
  if(r.error){toast('Could not update follow');return}
  if(has)follows.delete(uid);else follows.add(uid);
  if(cv()==='user')viewUser(stack[stack.length-1][1]);else renderPosts();
}
async function like(i,val){
  var p=posts[i],cur=myLikes[p.id],r;
  if(cur===val)r=await sb.from('likes').delete().eq('post_id',p.id).eq('user_id',me.id);
  else r=await sb.from('likes').upsert({post_id:p.id,user_id:me.id,value:val});
  if(r.error){toast('Could not save your reaction');return}
  if(cur===1)p.like_count--;
  if(cur===val)delete myLikes[p.id];else{myLikes[p.id]=val;if(val===1)p.like_count++}
  renderPosts();
}
async function delPost(i){
  if(!confirm('Delete this post?'))return;
  var r=await sb.from('posts').delete().eq('id',posts[i].id);
  if(r.error){toast('Could not delete');return}
  posts.splice(i,1);renderPosts();toast('Post deleted');
}

/* ---------- comments ---------- */
async function openC(i){cpost=i;$('#csheet').classList.add('show');await rc()}
async function rc(){
  $('#clist').innerHTML='<p class="cm mute">Loading…</p>';
  var r=await sb.from('comments').select('body,created_at,profiles(username,display_name)').eq('post_id',posts[cpost].id).order('created_at');
  if(r.error){$('#clist').innerHTML='<p class="cm mute">Could not load comments.</p>';return}
  $('#clist').innerHTML=(r.data||[]).map(function(c){var pr=c.profiles||{};return `<p class="cm"><b>${esc(pr.display_name||pr.username||'User')}</b> ${esc(c.body)}</p>`}).join('')||'<p class="cm mute">No comments yet. Start the conversation.</p>';
}
async function addC(){
  var v=$('#cin').value.trim();if(!v)return;
  var p=posts[cpost],r=await sb.from('comments').insert({post_id:p.id,author_id:me.id,body:v});
  if(r.error){toast('Could not post your comment');return}
  $('#cin').value='';p.comment_count=(p.comment_count||0)+1;await rc();renderPosts();
}

/* ---------- drop ---------- */
function openDrop(){$('#dsheet').classList.add('show')}
function kindChange(){$('#dp').classList.toggle('hide',$('#dk').value!=='product')}
async function upload(file){
  var ext=(file.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5).toLowerCase()||'bin';
  var path=me.id+'/'+Date.now()+'.'+ext;
  var up=await sb.storage.from('media').upload(path,file,{contentType:file.type});
  if(up.error)throw up.error;
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
async function dropGo(){
  var kind=$('#dk').value,cap=$('#dc').value.trim(),file=$('#df').files[0],price=$('#dp').value;
  var need={photo:'image/',video:'video/',reel:'video/',music:'audio/'}[kind];
  if(kind==='text'&&!cap){toast('Write something first');return}
  if(need&&!file){toast('Choose a file to drop');return}
  if(file&&need&&file.type.indexOf(need)!==0){toast('That file does not match the type you chose');return}
  if(kind==='product'&&(price===''||Number(price)<0)){toast('Enter a price');return}
  if(file&&file.size>50*1024*1024){toast('Files can be up to 50 MB');return}
  var btn=$('#dbtn');btn.disabled=true;btn.textContent='Dropping…';
  try{
    var url=file?await upload(file):null;
    var row={author_id:me.id,kind:kind,caption:cap||null,media_url:url};
    if(kind==='product')row.price_cents=Math.round(Number(price)*100);
    var ins=await sb.from('posts').insert(row);
    if(ins.error)throw ins.error;
    $('#dc').value='';$('#df').value='';$('#dp').value='';closeSheets();toast('Dropped! 🎉');
    if(cv()==='home')loadFeed();else if(cv()==='user')viewUser(stack[stack.length-1][1]);else setTab('home');
  }catch(e){toast(e.message||'Could not drop. Try again.')}
  btn.disabled=false;btn.textContent='Drop it';
}

/* ---------- profile ---------- */
async function viewUser(uid){
  var mine=uid===me.id;
  $('#view').innerHTML=sub(mine?'Profile':'Profile')+'<div class="empty">Loading…</div>';
  var c=await Promise.all([
    mine?Promise.resolve({data:prof}):sb.from('profiles').select('*').eq('id',uid).single(),
    sb.from('posts').select('*',{count:'exact',head:true}).eq('author_id',uid),
    sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',uid),
    sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',uid),
    sb.from('feed').select('*').eq('author_id',uid).order('created_at',{ascending:false}).limit(50)]);
  var pr=c[0].data;if(!pr){$('#view').innerHTML=sub('Profile')+'<div class="empty">This profile could not be found.</div>';return}
  var name=pr.display_name||pr.username,fol=follows.has(uid);
  var btns=mine?`<button class="pill" onclick="openEdit()">Edit profile</button>`:
    `<div style="display:flex;gap:8px"><button class="pill" onclick="open('chat','${uid}')">💌 Message</button><button class="pill${fol?' on':''}" onclick="toggleFollow('${uid}')">${fol?'Following':'Follow'}</button></div>`;
  $('#view').innerHTML=sub(esc(name))+`<div class="cover"></div><div class="pr">${avHtml(pr)}${btns}</div>
  <div class="pad"><b style="font-size:19px">${esc(name)}${pr.is_verified?' ✅':''}</b><div class="mute">@${esc(pr.username)}</div>
  ${pr.bio?`<p style="margin-top:8px;line-height:1.5">${esc(pr.bio)}</p>`:''}
  <div class="stat"><div><b>${c[1].count||0}</b><small>Posts</small></div><div><b>${c[2].count||0}</b><small>Followers</small></div><div><b>${c[3].count||0}</b><small>Following</small></div></div></div><div id="plist"></div>`;
  posts=c[4].data||[];ptarget='#plist';renderPosts();
}
function openEdit(){$('#en').value=prof.display_name||'';$('#eu').value=prof.username;$('#eb').value=prof.bio||'';$('#ef').value='';$('#esheet').classList.add('show')}
async function saveEdit(){
  var u=$('#eu').value.trim().toLowerCase(),file=$('#ef').files[0];
  if(!/^[a-z0-9_]{3,30}$/.test(u)){toast('Username: 3 to 30 letters, numbers or _');return}
  if(file&&(file.type.indexOf('image/')!==0||file.size>10*1024*1024)){toast('Choose an image under 10 MB');return}
  var btn=$('#ebtn');btn.disabled=true;btn.textContent='Saving…';
  try{
    var upd={display_name:$('#en').value.trim()||null,username:u,bio:$('#eb').value.trim()||null};
    if(file)upd.avatar_url=await upload(file);
    var r=await sb.from('profiles').update(upd).eq('id',me.id);
    if(r.error)throw r.error;
    prof=Object.assign(prof,upd);$('#hav').innerHTML=avHtml(prof);closeSheets();toast('Profile saved ✅');viewUser(me.id);
  }catch(e){toast(e.code==='23505'?'That username is taken':(e.message||'Could not save'))}
  btn.disabled=false;btn.textContent='Save';
}

/* ---------- search ---------- */
function viewSearch(){
  $('#view').innerHTML='<div class="pad"><input id="sq" class="sb" style="margin:0" placeholder="🔍 Search people and posts" oninput="sdebounce(this.value)"></div><div id="sres"><div class="empty">Find creators, sellers and posts.</div></div>';
  $('#sq').focus();
}
function sdebounce(v){clearTimeout(stimer);stimer=setTimeout(function(){doSearch(v)},350)}
async function doSearch(raw){
  var q=raw.replace(/[^\p{L}\p{N}_ ]/gu,'').trim(),box=$('#sres');if(!box)return;
  if(q.length<2){box.innerHTML='<div class="empty">Type at least 2 letters.</div>';return}
  var r=await Promise.all([
    sb.from('profiles').select('id,username,display_name,avatar_url,is_verified').or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(10),
    sb.from('feed').select('*').ilike('caption','%'+q+'%').order('created_at',{ascending:false}).limit(20)]);
  var people=r[0].data||[];posts=r[1].data||[];
  if(!$('#sres'))return;
  box.innerHTML=(people.length?'<div class="sub">People</div>'+people.map(function(p){return `<button class="row" onclick="openUser('${p.id}')">${avHtml(p)}<div class="t"><b>${esc(p.display_name||p.username)}${p.is_verified?' ✅':''}</b><small>@${esc(p.username)}</small></div></button>`}).join(''):'')+
   (posts.length?'<div class="sub">Posts</div><div id="sposts"></div>':'')+((people.length||posts.length)?'':'<div class="empty">No results for that search.</div>');
  if(posts.length){ptarget='#sposts';renderPosts()}
}

/* ---------- notifications ---------- */
async function viewAlerts(){
  $('#view').innerHTML=sub('Alerts')+'<div id="alist"><div class="empty">Loading…</div></div>';
  var r=await sb.from('notifications').select('id,type,post_id,is_read,created_at,actor_id,profiles!actor_id(username,display_name,avatar_url)').eq('user_id',me.id).order('created_at',{ascending:false}).limit(50);
  var box=$('#alist');if(!box)return;
  if(r.error){box.innerHTML='<div class="empty">Could not load alerts.</div>';return}
  var d=r.data||[];
  if(!d.length){box.innerHTML='<div class="empty">No alerts yet.<br>Likes, comments and new followers show up here. 🔔</div>';return}
  var txt={like:'👍 liked your post',comment:'💬 commented on your post',follow:'➕ started following you'};
  box.innerHTML=d.map(function(n){var a=n.profiles||{};return `<button class="row${n.is_read?'':' un'}" onclick="openUser('${n.actor_id}')">${avHtml(a)}<div class="t"><b>${esc(a.display_name||a.username||'Someone')}</b><small>${txt[n.type]||''} · ${ago(n.created_at)}</small></div>${n.is_read?'':'<i class="dot"></i>'}</button>`}).join('');
  if(unreadN){await sb.from('notifications').update({is_read:true}).eq('user_id',me.id).eq('is_read',false);unreadN=0;paint()}
}

/* ---------- messages ---------- */
async function viewMsgs(){
  if(cv()!=='msgs')return;
  $('#view').innerHTML=sub('Messages')+'<div id="mlist"><div class="empty">Loading…</div></div>';
  var r=await sb.from('messages').select('sender_id,recipient_id,body,read_at,created_at').or(`sender_id.eq.${me.id},recipient_id.eq.${me.id}`).order('created_at',{ascending:false}).limit(300);
  var box=$('#mlist');if(!box)return;
  if(r.error){box.innerHTML='<div class="empty">Could not load messages.</div>';return}
  var conv={},order=[];
  (r.data||[]).forEach(function(m){var o=m.sender_id===me.id?m.recipient_id:m.sender_id;if(!conv[o]){conv[o]={last:m,unread:0};order.push(o)}if(m.recipient_id===me.id&&!m.read_at)conv[o].unread++});
  if(!order.length){box.innerHTML='<div class="empty">No messages yet.<br>Open someone\'s profile and tap 💌 Message to start a chat.</div>';return}
  var pr=await sb.from('profiles').select('id,username,display_name,avatar_url').in('id',order);
  var map={};(pr.data||[]).forEach(function(p){map[p.id]=p});
  if(!$('#mlist'))return;
  $('#mlist').innerHTML=order.map(function(o){var p=map[o]||{},c=conv[o];return `<button class="row${c.unread?' un':''}" onclick="open('chat','${o}')">${avHtml(p)}<div class="t"><b>${esc(p.display_name||p.username||'User')}</b><small>${c.last.sender_id===me.id?'You: ':''}${esc(c.last.body)}</small></div><small class="mute">${ago(c.last.created_at)}</small>${c.unread?'<i class="dot"></i>':''}</button>`}).join('');
}
function addBub(m){var b=$('#bubs');if(!b)return;var d=document.createElement('div');d.className='bub '+(m.sender_id===me.id?'me':'th');d.textContent=m.body;b.appendChild(d);window.scrollTo(0,document.body.scrollHeight)}
async function markRead(uid){
  await sb.from('messages').update({read_at:new Date().toISOString()}).eq('recipient_id',me.id).eq('sender_id',uid).is('read_at',null);
  badges();
}
async function viewChat(uid){
  $('#view').innerHTML=sub('Chat')+'<div class="pad"><div id="bubs"></div><div style="display:flex;gap:8px;margin-top:10px"><input id="min" class="sb" style="margin:0" maxlength="2000" placeholder="Message 😊" onkeydown="if(event.key===\'Enter\')msend()"><button class="pill on" onclick="msend()">Send</button></div></div>';
  var r=await Promise.all([
    sb.from('profiles').select('username,display_name').eq('id',uid).single(),
    sb.from('messages').select('sender_id,recipient_id,body,created_at').or(`and(sender_id.eq.${me.id},recipient_id.eq.${uid}),and(sender_id.eq.${uid},recipient_id.eq.${me.id})`).order('created_at',{ascending:true}).limit(200)]);
  var s=document.querySelector('.sub span');if(s&&r[0].data)s.textContent=r[0].data.display_name||r[0].data.username;
  (r[1].data||[]).forEach(addBub);markRead(uid);
}
async function msend(){
  var inp=$('#min'),v=inp.value.trim(),uid=stack[stack.length-1][1];if(!v)return;
  var r=await sb.from('messages').insert({sender_id:me.id,recipient_id:uid,body:v});
  if(r.error){toast('Could not send');return}
  inp.value='';addBub({sender_id:me.id,body:v});
}

  <details><summary>🔐 Privacy</summary><p>We collect what you give us (email, profile, posts, messages, orders) and basic app usage. We never sell your personal data. You can ask us to delete your data.</p></details>

  <details><summary>🤝 Community rules</summary><p>No hate, harassment, threats, violence, scams or sexual content involving minors. Repeat violations end accounts.</p></details>
  <details><summary>🛍️ Seller rules</summary><p>List only real items you can deliver. No illegal, counterfeit or dangerous goods. Describe items honestly.</p></details>
  <details><summary>©️ Copyright</summary><p>Post only what you made or have permission to use.</p></details></div>`;
}
