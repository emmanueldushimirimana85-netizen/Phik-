var FRX=[[/^👍 liked your post · (.+)$/,'👍 a aimé votre publication · $1'],[/^💬 commented on your post · (.+)$/,'💬 a commenté votre publication · $1'],[/^➕ started following you · (.+)$/,'➕ s’est abonné à vous · $1'],[/^Subscribe to (.+)$/,'S’abonner à $1'],[/^Replying to (.+)$/,'Réponse à $1']];
function trText(t){var m=t.match(/^(\s*)([\s\S]*?)(\s*)$/),k=m[2];if(!k)return t;var v=FR[k];if(v===undefined){for(var i=0;i<FRX.length;i++){if(FRX[i][0].test(k)){v=k.replace(FRX[i][0],FRX[i][1]);break}}}return v===undefined?t:m[1]+v+m[3]}
function trTree(n){
  if(LANG!=='fr')return;
  if(n.nodeType===3){var v=trText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
  if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE')return;
  if(n.placeholder){var q=trText(n.placeholder);if(q!==n.placeholder)n.placeholder=q}
  for(var c=n.firstChild;c;c=c.nextSibling)trTree(c);
}

}

/* ---------- auth ---------- */
function swap(){signup=!signup;$('#dn').classList.toggle('hide',!signup);$('#abtn').textContent=signup?'Create account':'Log in';$('#atag').textContent=signup?'Create your PHIK account':'Log in to continue';$('#alink').textContent=signup?'I already have an account':'Create an account';$('#pw').autocomplete=signup?'new-password':'current-password';msg('')}
async function authGo(){
  var email=$('#em').value.trim(),password=$('#pw').value;
  if(!email||password.length<8){msg('Enter your email and a password of 8 or more characters.');return}
  $('#abtn').disabled=true;msg('');
  try{
    if(signup){
      var r=await sb.auth.signUp({email:email,password:password,options:{data:{display_name:$('#dn').value.trim()||undefined},emailRedirectTo:location.origin+location.pathname}});
      if(r.error)throw r.error;
      if(!r.data.session){swap();msg('Almost done. Open the email we sent you and tap the confirmation link, then log in.')}
    }else{
      var r2=await sb.auth.signInWithPassword({email:email,password:password});
      if(r2.error)throw r2.error;
    }
  }catch(e){msg(e.message||'Something went wrong. Try again.')}
  $('#abtn').disabled=false;
}
async function logout(){closeSheets();var a=$('#pl');if(a){a.pause();a.removeAttribute('src')}$('#mini').classList.add('hide');document.body.classList.remove('pm');sb.removeAllChannels();me=null;await sb.auth.signOut()}
sb.auth.onAuthStateChange(function(ev,s){setTimeout(function(){boot(s);if(ev==='PASSWORD_RECOVERY')$('#rsheet').classList.add('show')},0)});
async function forgot(){var e=$('#em').value.trim();if(!e){msg('Type your email first, then tap Forgot password.');return}var r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});msg(r.error?r.error.message:'Check your email for a reset link.')}
function openPw(){$('#np').value='';$('#rsheet').classList.add('show')}
async function setPw(){var v=$('#np').value;if(v.length<8){toast('Use 8 or more characters');return}var r=await sb.auth.updateUser({password:v});if(r.error){toast(r.error.message);return}closeSheets();toast('Password updated ✅')}
async function boot(s){
  if(!s){me=null;$('#app').classList.add('hide');$('#auth').classList.remove('hide');return}
  if(me&&me.id===s.user.id)return;
  me=s.user;
  var res=await Promise.all([
    sb.from('profiles').select('*').eq('id',me.id).single(),
    sb.from('follows').select('following_id').eq('follower_id',me.id),
    sb.from('likes').select('post_id,value').eq('user_id',me.id),
    sb.from('saves').select('post_id').eq('user_id',me.id),
    sb.from('subscriptions').select('creator_id,status').eq('subscriber_id',me.id),
    sb.from('blocks').select('target_id,kind').eq('user_id',me.id)]);
  prof=res[0].data||{username:'you',display_name:'You',bio:''};
  follows=new Set((res[1].data||[]).map(function(r){return r.following_id}));
  myLikes={};(res[2].data||[]).forEach(function(r){myLikes[r.post_id]=r.value});
  saved=new Set((res[3].data||[]).map(function(r){return r.post_id}));subs={};(res[4].data||[]).forEach(function(r){subs[r.creator_id]=r.status});
  blockMap={};(res[5].data||[]).forEach(function(r){blockMap[r.target_id]=r.kind});
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');
  $('#hav').innerHTML=avHtml(prof);
  stack=[['home']];render();badges();subscribe();routeHash();
}

/* ---------- realtime and badges ---------- */
function paint(){var a=$('#bn'),b=$('#bm');a.textContent=unreadN;b.textContent=unreadM;a.classList.toggle('hide',!unreadN);b.classList.toggle('hide',!unreadM)}
async function badges(){
  var r=await Promise.all([
    sb.from('notifications').select('*',{count:'exact',head:true}).eq('user_id',me.id).eq('is_read',false),
    sb.from('messages').select('*',{count:'exact',head:true}).eq('recipient_id',me.id).is('read_at',null)]);
  unreadN=r[0].count||0;unreadM=r[1].count||0;paint();
}
function subscribe(){
  sb.channel('rt-'+me.id)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient_id=eq.'+me.id},function(p){onMsg(p.new)})
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+me.id},function(){unreadN++;paint();if(cv()==='alerts')viewAlerts()})
   .subscribe();
}
function onMsg(m){
  var top=stack[stack.length-1];
  if(top[0]==='chat'&&top[1]===m.sender_id){addBub(m);markRead(m.sender_id);return}
  unreadM++;paint();if(top[0]==='msgs')viewMsgs();
}

document.querySelectorAll('nav [data-t]').forEach(function(b){b.onclick=function(){setTab(b.dataset.t)}});
function setTab(t){stack=[[t]];render()}
function open(v,a){stack.push([v,a]);render()}
function back(){if(stack.length>1){stack.pop();render()}}
function openUser(id){open('user',id)}
function render(){
  var t=stack[stack.length-1],root=stack[0][0];
  document.querySelectorAll('nav [data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t===root)});
  window.scrollTo(0,0);
  watchId=null;listMode='';(({settings:viewSettings,blocked:viewBlocked,admin:viewAdmin,post:viewPost,watch:viewWatch,home:viewHome,search:viewSearch,alerts:viewAlerts,msgs:viewMsgs,chat:viewChat,user:viewUser,policy:viewPolicy,saved:viewSaved})[t[0]]||VIEWS[t[0]])(t[1]);
}

function drawGo(w){
  closeSheets();
  if(w==='profile'){stack=[['user',me.id]];render()}
  else if(w==='policy'){stack=[['policy']];render()}else if(w==='saved'){stack=[['saved']];render()}else if(w==='settings'||w==='admin'){stack=[[w]];render()}
  else{homeTab=w;setTab('home')}
}
function closeSheets(){document.querySelectorAll('.sheet').forEach(function(s){s.classList.remove('show')})}

/* ---------- home feed ---------- */
function viewHome(){
  var tabs=[['foryou','For you'],['trending','Trending'],['following','Following'],['music','Music'],['movies','Movies'],['reel','Reels'],['shop','Shop']];
  $('#view').innerHTML='<div class="ht">'+tabs.map(function(t){return `<button class="${homeTab===t[0]?'on':''}" onclick="homeTab='${t[0]}';viewHome()">${t[1]}</button>`}).join('')+'</div><div id="plist"></div><div id="more"></div>';
  loadFeed();
}
function score(p){var h=(Date.now()-new Date(p.created_at))/36e5,v=(3*Number(p.like_count||0)+4*Number(p.comment_count||0)+1)/Math.pow(h+2,1.2);return follows.has(p.author_id)?v*1.6:v}
async function loadFeed(more){
  ptarget='#plist';listMode='';var box=$('#plist');if(!box)return;
  if(homeTab==='music'){loadMusic();return}if(homeTab==='movies'){loadMovies();return}
  if(more!==true){feedPage=0;rawPosts=[]}
  if(homeTab==='following'&&!follows.size){posts=[];$('#more').innerHTML='';suggest(box);return}
  if(more!==true)box.innerHTML='<div class="empty">Loading…</div>';
  var from=feedPage*FP,q=sb.from('feed').select('*').order('created_at',{ascending:false}).range(from,from+FP-1);
  if(homeTab==='reel')q=q.in('kind',['reel','video']);
  if(homeTab==='shop')q=q.eq('kind','product');
  if(homeTab==='following')q=q.in('author_id',Array.from(follows));
  if(homeTab==='trending')q=q.gte('created_at',new Date(Date.now()-7*864e5).toISOString());
  var r=await q;if(!$('#plist'))return;
  if(r.error){box.innerHTML='<div class="empty">Could not load posts. Check your connection and try again.</div>';return}
  var got=r.data||[];feedPage++;
  var have={};rawPosts.forEach(function(p){have[p.id]=1});
  rawPosts=rawPosts.concat(got.filter(function(p){return !blockMap[p.author_id]&&!have[p.id]}));
  posts=rawPosts.slice();
  if(homeTab==='foryou')posts.sort(function(a,b){return score(b)-score(a)});
  if(homeTab==='trending')posts.sort(function(a,b){return (Number(b.like_count)+2*Number(b.comment_count))-(Number(a.like_count)+2*Number(a.comment_count))});
  renderPosts();
  var mo=$('#more');if(mo)mo.innerHTML=got.length===FP?'<button class="big" style="width:calc(100% - 28px);margin:14px" onclick="loadFeed(true)">Load more</button>':'';
}
async function suggest(box){
  box.innerHTML='<div class="empty">Loading…</div>';
  var r=await sb.from('profiles').select('id,username,display_name,avatar_url,is_verified').neq('id',me.id).order('created_at',{ascending:false}).limit(12);
  var l=(r.data||[]).filter(function(p){return !follows.has(p.id)&&!blockMap[p.id]});
  box.innerHTML='<div class="sub">Who to follow</div>'+(l.map(function(p){return `<div class="row"><span onclick="openUser('${p.id}')">${avHtml(p)}</span><div class="t" onclick="openUser('${p.id}')"><b>${esc(p.display_name||p.username)}${p.is_verified?' ✅':''}</b><small>@${esc(p.username)}</small></div><button class="pill" onclick="followSug('${p.id}')">Follow</button></div>`}).join('')||'<div class="empty">Nobody to suggest yet.</div>');
}
async function followSug(uid){var r=await sb.from('follows').insert({follower_id:me.id,following_id:uid});if(r.error){toast('Could not follow');return}follows.add(uid);loadFeed()}
function okUrl(u){return u&&u.indexOf(SB_URL)===0}
function coverHtml(p){return okUrl(p.cover_url)?`<img class="cov" src="${esc(p.cover_url)}" alt="" loading="lazy">`:`<div class="cov">${p.kind==='movie'?'🎬':'♪'}</div>`}
function mediaHtml(p){
  var u=p.media_url;if(!okUrl(u))return '';
  var price=p.price_cents!=null?`<span class="price">$${(p.price_cents/100).toFixed(2)}</span>`:'';
  if(p.kind==='movie'){
    if(watchId===p.id)return `<div class="media"><video src="${esc(u)}" ${okUrl(p.cover_url)?`poster="${esc(p.cover_url)}"`:''} controls autoplay playsinline></video></div>`;
    return `<div class="media poster" onclick="open('watch','${p.id}')">${coverHtml(p)}<span class="plb">▶</span></div>`;
  }
  if(p.kind==='music')return `<div class="trk" onclick="playPost('${p.id}')">${coverHtml(p)}<div class="t"><b>${esc(p.title||'Untitled')}</b><small>${esc(p.genre||'Music')}</small></div><span class="pb">▶️</span></div>`;
  if(p.kind==='video'||p.kind==='reel')return `<div class="media"><video src="${esc(u)}" data-pid="${p.id}" ${okUrl(p.cover_url)?`poster="${esc(p.cover_url)}"`:''} controls playsinline preload="metadata"></video>${price}</div>`;
  return `<div class="media"${p.kind==='product'?` onclick="open('product','${p.id}')" style="cursor:pointer"`:''}><img src="${esc(u)}" alt="" loading="lazy">${price}</div>`;
}
function subPill(uid){var st=subs[uid];return `<button class="pill${st==='active'?' on':''}" onclick="openSub('${uid}')">${st==='active'?'Subscribed':(st==='waitlist'?'Waitlisted':'Subscribe')}</button>`}
function renderPosts(){
  var box=$(ptarget);if(!box)return;
  if(listMode==='tracks'){renderTracks();return}
  if(!posts.length){box.innerHTML='<div class="empty">Nothing here yet.<br>Tap + to drop a post. 🚀</div>';return}
  box.innerHTML=posts.map(function(p,i){
    var mine=p.author_id===me.id,v=myLikes[p.id],name=p.display_name||p.username,fol=follows.has(p.author_id),sv=saved.has(p.id);
    names[p.author_id]=name;
    var priceOnly=(p.kind==='product'&&!p.media_url&&p.price_cents!=null)?`<div class="cap"><b>$${(p.price_cents/100).toFixed(2)}</b></div>`:'';
    return `<article class="post"><div class="ph"><span onclick="openUser('${p.author_id}')">${avHtml(p)}</span>
    <div class="who" onclick="openUser('${p.author_id}')"><b>${esc(name)}${p.is_verified?' ✅':''}</b><small>@${esc(p.username)} · ${ago(p.created_at)}${Number(p.view_count)?' · 👁 '+(window.fmt?fmt(p.view_count):p.view_count):''}</small></div>
    ${mine?'':`<button class="pill${fol?' on':''}" onclick="toggleFollow('${p.author_id}')">${fol?'Following':'Follow'}</button>${subPill(p.author_id)}`}
    <button class="dots" onclick="openMore(${i})" aria-label="More">${ic('more')}</button></div>
    ${p.title?`<p class="cap"><b>${esc(p.title)}</b>${p.genre?' · '+esc(p.genre):''}</p>`:''}${p.caption?`<p class="cap">${linkify(p.caption)}</p>`:''}${mediaHtml(p)}${priceOnly}
    <div class="act"><button class="${v===1?'on':''}" onclick="like(${i},1)" aria-label="Like">${ic('up',v===1)}<span>${p.like_count||0}</span></button>
    <button class="${v===-1?'on':''}" onclick="like(${i},-1)" aria-label="Dislike">${ic('down',v===-1)}</button>
    <button onclick="openC(${i})" aria-label="Comments">${ic('chat')}<span>${p.comment_count||0}</span></button>

function playPost(id){
  var list=posts.filter(function(p){return p.kind==='music'&&okUrl(p.media_url)});
  var i=list.findIndex(function(p){return p.id===id});if(i<0)return;
  if(qi>=0&&queue[qi]&&queue[qi].id===id){togglePlay();return}
  queue=list;qi=i;loadTrack();
}
function loadTrack(){
  var p=queue[qi],a=$('#pl');a.src=p.media_url;a.play().catch(function(){toast('Tap play to start')});
  $('#mini').classList.remove('hide');document.body.classList.add('pm');
  $('#mtt').textContent=p.title||'Untitled';$('#mta').textContent=p.display_name||p.username;
  $('#mcov').innerHTML=coverHtml(p);
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:p.title||'Untitled',artist:p.display_name||p.username,artwork:okUrl(p.cover_url)?[{src:p.cover_url}]:[]});navigator.mediaSession.setActionHandler('nexttrack',nextT);navigator.mediaSession.setActionHandler('previoustrack',prevT)}catch(e){}}
  if(listMode==='tracks')renderTracks();
}
function togglePlay(){var a=$('#pl');if(!a.src)return;if(a.paused)a.play();else a.pause()}
function nextT(){if(qi<queue.length-1){qi++;loadTrack()}}
function prevT(){var a=$('#pl');if(a.currentTime>3||qi<=0){a.currentTime=0}else{qi--;loadTrack()}}
(function(){var a=$('#pl');
  a.addEventListener('ended',nextT);
  a.addEventListener('play',function(){$('#mpp').textContent='⏸️'});
  a.addEventListener('pause',function(){$('#mpp').textContent='▶️'});
  a.addEventListener('timeupdate',function(){if(a.duration)$('#mbar').style.width=(a.currentTime/a.duration*100)+'%'});
})();
function renderTracks(){
  var box=$(ptarget);if(!box)return;
  if(!posts.length){box.innerHTML='<div class="empty">No tracks here yet.<br>Creators can drop music with +. 🎵</div>';return}
  box.innerHTML=posts.map(function(p,i){
    var cur=qi>=0&&queue[qi]&&queue[qi].id===p.id,sv=saved.has(p.id);
    return `<div class="mrow${cur?' cur':''}"><div class="mr" onclick="playPost('${p.id}')">${coverHtml(p)}<div class="t"><b>${esc(p.title||'Untitled')}</b><small>${esc(p.display_name||p.username)}${p.genre?' · '+esc(p.genre):''}</small></div></div>
    <button class="${sv?'on':''}" onclick="toggleSave(${i})" aria-label="Add to library">${ic('mark',sv)}</button><button onclick="openMore(${i})" aria-label="More">${ic('more')}</button></div>`}).join('');
}
async function loadMusic(){
  $('#plist').innerHTML=`<div class="chips2"><button class="${musicTab==='discover'?'on':''}" onclick="musicTab='discover';loadMusic()">Discover</button><button class="${musicTab==='library'?'on':''}" onclick="musicTab='library';loadMusic()">Library</button></div><div id="tl"><div class="empty">Loading…</div></div>`;
  ptarget='#tl';listMode='tracks';
  var q=sb.from('feed').select('*').eq('kind','music').order('created_at',{ascending:false}).limit(60);
  if(musicTab==='library'){var ids=Array.from(saved);if(!ids.length){posts=[];$('#tl').innerHTML='<div class="empty">Your library is empty.<br>Tap the bookmark on a track to add it. 🔖</div>';return}q=q.in('id',ids)}
  var r=await q;if(!$('#tl'))return;
  if(r.error){$('#tl').innerHTML='<div class="empty">Could not load music.</div>';return}
  posts=r.data||[];renderPosts();
}
async function loadMovies(){
  var box=$('#plist');box.innerHTML='<div class="empty">Loading…</div>';
  var r=await sb.from('feed').select('*').eq('kind','movie').order('created_at',{ascending:false}).limit(80);
  if(!$('#plist'))return;
  if(r.error){box.innerHTML='<div class="empty">Could not load movies.</div>';return}
  var m=r.data||[];posts=m;
  if(!m.length){box.innerHTML='<div class="empty">No movies yet.<br>Creators can drop a movie with + for the world to watch. 🍿</div>';return}
  var hero=m.slice().sort(function(a,b){return (b.like_count||0)-(a.like_count||0)})[0];
  function card(p){return `<button class="pst" onclick="open('watch','${p.id}')">${coverHtml(p)}<small>${esc(p.title||'Untitled')}</small></button>`}
  var rows=[['🆕 New releases',m.slice(0,10)]];
  MG.forEach(function(g){var l=m.filter(function(p){return p.genre===g});if(l.length)rows.push([g,l])});
  box.innerHTML=`<div class="hero" onclick="open('watch','${hero.id}')">${coverHtml(hero)}<div class="ov"><b>${esc(hero.title||'Untitled')}</b><span>▶ Play</span></div></div>`+
   rows.map(function(r){return `<h3 class="rh">${esc(r[0])}</h3><div class="rail">${r[1].map(card).join('')}</div>`}).join('');
}
async function viewWatch(id){
  var a=$('#pl');if(a)a.pause();
  $('#view').innerHTML=sub('Watch')+'<div id="plist"><div class="empty">Loading…</div></div>';
  var r=await sb.from('feed').select('*').eq('id',id).single();

/* ---------- tags, post page ---------- */
async function loadTags(){
  var r=await sb.from('trending_tags').select('tag,uses'),b=$('#sres');if(!b||!(r.data||[]).length)return;
  b.innerHTML='<div class="sub">Trending now</div><div class="pad">'+r.data.map(function(t){return `<a class="chip" onclick="searchTag('#${esc(t.tag)}')">#${esc(t.tag)}</a>`}).join('')+'</div>';

function routeHash(){

async function viewPost(id){

/* ---------- block, mute ---------- */
function userMenu(uid){
  var k=blockMap[uid];
  $('#mbody').innerHTML=`<button class="mi" onclick="setBlock('${uid}','mute')"><em>🔇</em>${k==='mute'?'Unmute':'Mute'}</button><button class="mi" onclick="setBlock('${uid}','block')"><em>🚫</em>${k==='block'?'Unblock':'Block'}</button>`;
  $('#msheet').classList.add('show');
}
async function setBlock(uid,kind){
  closeSheets();var cur=blockMap[uid],r;
  if(cur===kind){r=await sb.from('blocks').delete().eq('user_id',me.id).eq('target_id',uid);if(r.error){toast('Could not update');return}delete blockMap[uid];toast('Done')}
  else{
    if(cur)await sb.from('blocks').delete().eq('user_id',me.id).eq('target_id',uid);
    r=await sb.from('blocks').insert({user_id:me.id,target_id:uid,kind:kind});if(r.error){toast('Could not update');return}
    blockMap[uid]=kind;
    if(kind==='block'){await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',uid);follows.delete(uid)}
    toast(kind==='block'?'Blocked':'Muted');
  }
  if(cv()==='user')viewUser(stack[stack.length-1][1]);else refreshView();
}
async function viewBlocked(){
  $('#view').innerHTML=sub('Blocked and muted')+'<div id="bl"><div class="empty">Loading…</div></div>';
  var r=await sb.from('blocks').select('target_id,kind,profiles!target_id(username,display_name,avatar_url)').eq('user_id',me.id);
  var b=$('#bl');if(!b)return;
  b.innerHTML=(r.data||[]).map(function(x){var p=x.profiles||{};return `<div class="row">${avHtml(p)}<div class="t"><b>${esc(p.display_name||p.username||'User')}</b><small>${x.kind==='block'?'Blocked':'Muted'}</small></div><button class="pill" onclick="setBlock('${x.target_id}','${x.kind}').then(viewBlocked)">Undo</button></div>`}).join('')||'<div class="empty">Nobody blocked or muted.</div>';
}

/* ---------- settings, account ---------- */
function viewSettings(){
  $('#view').innerHTML=sub('Settings')+`<div class="pad"><h3 class="sh">Language</h3><div style="display:flex;gap:8px"><button class="pill${LANG==='en'?' on':''}" onclick="setLang('en')">English</button><button class="pill${LANG==='fr'?' on':''}" onclick="setLang('fr')">Français</button></div>
  <h3 class="sh">Account</h3>
  <button class="mi" onclick="changeEmail()"><em>✉️</em>Change email</button>

  <button class="mi" onclick="open('blocked')"><em>🚫</em>Blocked and muted</button>

async function changeEmail(){
  var e=prompt('New email address');if(!e)return;
  var r=await sb.auth.updateUser({email:e.trim()},{emailRedirectTo:location.origin+location.pathname});
  toast(r.error?r.error.message:'Check your new email to confirm the change');
}
async function exportData(){
  toast('Preparing your data…');
  var q=await Promise.all([
    sb.from('profiles').select('*').eq('id',me.id),sb.from('posts').select('*').eq('author_id',me.id),
    sb.from('comments').select('*').eq('author_id',me.id),sb.from('messages').select('*').or(`sender_id.eq.${me.id},recipient_id.eq.${me.id}`),
    sb.from('saves').select('*').eq('user_id',me.id),sb.from('follows').select('*').or(`follower_id.eq.${me.id},following_id.eq.${me.id}`),
    sb.from('likes').select('*').eq('user_id',me.id)]);
  var out={exported_at:new Date().toISOString(),email:me.email,profile:q[0].data,posts:q[1].data,comments:q[2].data,messages:q[3].data,saves:q[4].data,follows:q[5].data,likes:q[6].data};
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='phik-my-data.json';document.body.appendChild(a);a.click();a.remove();
}
async function delAccount(){
  if(!confirm('Delete your account and all your posts, messages and data? This cannot be undone.'))return;
  if(prompt('Type DELETE to confirm')!=='DELETE')return;
  var r=await sb.rpc('delete_my_account');
  if(r.error){toast('Could not delete your account');return}
  await logout();
}

/* ---------- admin ---------- */
async function viewAdmin(){
  if(!prof.is_admin){back();return}
  $('#view').innerHTML=sub('🛡️ Admin')+`<div class="pad"><p class="mute" style="margin-bottom:8px">Verify or ban a user by username</p><input id="au" class="sb" placeholder="username"><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="pill" onclick="adminUser('verify',true)">✅ Verify</button><button class="pill" onclick="adminUser('verify',false)">Remove badge</button><button class="pill" onclick="adminUser('ban',true)">⛔ Ban</button><button class="pill" onclick="adminUser('ban',false)">Unban</button></div></div><div class="sub">Open reports</div><div id="rp"><div class="empty">Loading…</div></div>`;
  var r=await sb.from('reports').select('id,reason,created_at,post_id,reporter:profiles!reporter_id(username),posts(id,author_id,kind,title,caption,profiles(username,display_name))').eq('status','open').order('created_at',{ascending:false}).limit(50);
  var b=$('#rp');if(!b)return;
  if(r.error){b.innerHTML='<div class="empty">Could not load reports.</div>';return}
  b.innerHTML=(r.data||[]).map(function(x){var po=x.posts||{},au=po.profiles||{};return `<div class="pad" style="border-bottom:1px solid var(--line)"><b>@${esc(au.username||'?')}</b> <span class="mute">· ${esc(po.kind||'')}</span><p style="margin:6px 0">${esc((po.title||po.caption||'(media only)').slice(0,160))}</p><p class="mute" style="margin-bottom:8px">Reported by @${esc((x.reporter||{}).username||'?')}: ${esc(x.reason||'no reason given')}</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="pill" onclick="adminDel('${x.id}','${x.post_id}')">Delete post</button><button class="pill" onclick="adminBan('${po.author_id}')">Ban author</button><button class="pill" onclick="adminResolve('${x.id}')">Dismiss</button></div></div>`}).join('')||'<div class="empty">No open reports. 🎉</div>';
}
async function adminDel(rid,pid){if(!confirm('Delete this post?'))return;var r=await sb.from('posts').delete().eq('id',pid);toast(r.error?'Could not delete':'Post deleted');viewAdmin()}
async function adminBan(uid){if(!confirm('Ban this user?'))return;var r=await sb.rpc('admin_set_banned',{uid:uid,v:true});toast(r.error?'Could not ban':'User banned');viewAdmin()}
async function adminResolve(rid){await sb.from('reports').update({status:'resolved'}).eq('id',rid);viewAdmin()}
async function adminUser(what,flag){
  var u=($('#au').value||'').trim().toLowerCase().replace(/^@/,'');if(!u){toast('Type a username');return}
  var f=await sb.from('profiles').select('id').eq('username',u).maybeSingle();if(!f.data){toast('User not found');return}
  var r=await sb.rpc(what==='verify'?'admin_set_verified':'admin_set_banned',{uid:f.data.id,v:flag});
  toast(r.error?'Not allowed':'Done ✅');
}

  $('#view').innerHTML=sub('🔖 Saved')+'<div id="plist"><div class="empty">Loading…</div></div>';

var _rp=renderPosts;renderPosts=function(){_rp();setupAutoplay()};
function setupAutoplay(){
  if(vio)vio.disconnect();if(!('IntersectionObserver' in window))return;
  vio=new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target;if(e.intersectionRatio>0.6){v.muted=true;var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});if(window.countView&&v.dataset.pid)countView(v.dataset.pid)}else v.pause()})},{threshold:[0,0.6]});
  document.querySelectorAll('#view video').forEach(function(v){if(!v.autoplay)vio.observe(v)});
}
$('#lg').textContent=LANG==='fr'?'English':'Français';
if(LANG==='fr'){document.documentElement.lang='fr';trTree(document.body);new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==='characterData')trTree(m.target);else m.addedNodes.forEach(trTree)})}).observe(document.body,{childList:true,subtree:true,characterData:true})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
