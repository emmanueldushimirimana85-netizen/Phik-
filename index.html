<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHIK</title>
<style>
:root{--bg:#fff;--ink:#0F1419;--mute:#536471;--line:#EFF3F4;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#E7E9EA;--mute:#71767B;--line:#2F3336;--on:#000;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:env(safe-area-inset-top,0px) 0 96px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--ink)}
.hide{display:none!important}
.mute{color:var(--mute)}
.sb{width:100%;margin-bottom:10px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.big{width:100%;padding:13px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;margin:4px 0 10px}
.big:disabled{opacity:.5}
.logo{width:34px;height:34px;border-radius:11px;background:var(--ink);color:var(--bg);font-weight:800;display:grid;place-items:center}
.wrap{padding:60px 22px;text-align:center}.wrap .logo{width:60px;height:60px;font-size:28px;margin:0 auto 12px}.wrap h1{margin-bottom:6px}.wrap p{margin:10px 0}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);z-index:5}
.title{flex:1;text-align:center;font-weight:800;font-size:20px;letter-spacing:.04em}
.ib{width:36px;height:36px;font-size:18px}
.post{border-bottom:1px solid var(--line);padding:12px 0}
.ph{display:flex;align-items:center;gap:10px;padding:0 12px 8px}
.av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;flex:none}
.who{flex:1;min-width:0;line-height:1.3}.who small{color:var(--mute);display:block}
.pill{padding:6px 12px;border-radius:99px;border:1.5px solid var(--ink);font-weight:600;font-size:12px}.pill.on{background:var(--ink);color:var(--bg)}
.cap{padding:0 12px 10px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.media{position:relative}.media img,.media video{width:100%;max-height:520px;object-fit:cover;display:block;background:var(--line)}.media audio{width:100%}
.price{position:absolute;right:10px;bottom:10px;background:var(--bg);color:var(--ink);font-weight:800;padding:5px 11px;border-radius:99px}
.act{display:flex;align-items:center;gap:2px;padding:8px 6px 0}.act button{padding:7px 10px;border-radius:99px}.act button.on{background:var(--line);font-weight:700}
.buy{margin-left:auto;background:var(--ink);color:var(--bg)!important;font-weight:800}
.empty{padding:50px 24px;text-align:center;color:var(--mute);line-height:1.6}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;font-size:11px;color:var(--mute);display:grid;gap:2px;justify-items:center}nav button span{font-size:21px}nav button.on{color:var(--ink);font-weight:700}
nav .plus{flex:none;width:54px;height:54px;border-radius:18px;margin-top:-26px;background:var(--ink);color:var(--bg);font-size:30px;display:grid;place-items:center}
.sheet{position:fixed;inset:0;background:#0009;z-index:9;display:none;align-items:flex-end;justify-content:center}.sheet.show{display:flex}
.in{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}.in h3{margin-bottom:12px}
.cm{padding:9px 0;border-bottom:1px solid var(--line);line-height:1.45}.cm small{color:var(--mute)}
.page{padding:16px 14px}.stat{display:flex;gap:10px;margin:12px 0}.stat div{flex:1;border:1px solid var(--line);border-radius:14px;padding:10px}.stat b{display:block;font-size:18px}.stat small{color:var(--mute)}
details{border-bottom:1px solid var(--line);padding:12px 2px;line-height:1.55}summary{font-weight:700}details p{color:var(--mute);margin-top:6px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}.toast.show{opacity:1}
</style>
</head>
<body>

<div id="auth" class="wrap hide">
  <div class="logo">K</div><h1>PHIK</h1>
  <p class="mute" id="atag">Log in to continue</p>
  <input id="dn" class="sb hide" placeholder="Your name">
  <input id="em" class="sb" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" class="sb" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
  <button class="big" id="abtn" onclick="authGo()">Log in</button>
  <p><a href="#" id="alink" onclick="swap();return false">Create an account</a></p>
  <p id="amsg" class="mute"></p>
  <p class="mute" style="font-size:12px">By continuing you agree to the Terms and Privacy Policy.</p>
</div>

<div id="app" class="hide">
  <header>
    <div class="logo">K</div><div class="title">PHIK</div>
    <button class="ib" onclick="toast('Messages are coming soon')">💌</button>
    <button class="ib" onclick="toast('Notifications are coming soon')">🔔</button>
  </header>
  <main id="list"></main>
  <main id="me" class="page hide"></main>
  <nav>
    <button data-t="home" class="on"><span>🏠</span>Home</button>
    <button data-t="reel"><span>🎬</span>Reels</button>
    <button class="plus" onclick="openDrop()">+</button>
    <button data-t="shop"><span>🛍️</span>My Shop</button>
    <button data-t="me"><span>👤</span>Profile</button>
  </nav>
</div>

<div class="sheet" id="dsheet" onclick="if(event.target===this)closeSheets()"><div class="in">
  <h3>Drop something</h3>
  <select id="dk" class="sb" onchange="kindChange()">
    <option value="text">💬 Text post</option><option value="photo">📷 Photo</option><option value="video">🎥 Video</option>
    <option value="reel">🎞️ Reel</option><option value="music">🎵 Music track</option><option value="product">🏷️ Product for sale</option>
  </select>
  <textarea id="dc" class="sb" rows="3" maxlength="2000" placeholder="What is new?"></textarea>
  <input id="dp" class="sb hide" type="number" min="0" step="0.01" placeholder="Price in USD">
  <input id="df" class="sb" type="file" accept="image/*,video/*,audio/*">
  <button class="big" id="dbtn" onclick="dropGo()">Drop it</button>
</div></div>

<div class="sheet" id="csheet" onclick="if(event.target===this)closeSheets()"><div class="in">
  <h3>Comments</h3><div id="clist"></div>
  <div style="display:flex;gap:8px;margin-top:12px"><input id="cin" class="sb" style="margin:0" maxlength="1000" placeholder="Add a comment"><button class="pill on" onclick="addC()">Post</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SB_URL='https://zlooiujusjowetqqkikx.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsb29pdWp1c2pvd2V0cXFraWt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMjkyNjcsImV4cCI6MjEwODcwNTI2N30.IPIvvI82cFNgru-thEmeYb0NPOnhYWYNAhyhudV5mzw';
var sb=supabase.createClient(SB_URL,SB_KEY);
var me=null,prof=null,follows=new Set(),myLikes={},tab='home',posts=[],cpost=null,signup=false;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(function(){t.classList.remove('show')},2400)}
function msg(m){$('#amsg').textContent=m}

/* ---------- auth ---------- */
function swap(){signup=!signup;$('#dn').classList.toggle('hide',!signup);$('#abtn').textContent=signup?'Create account':'Log in';$('#atag').textContent=signup?'Create your PHIK account':'Log in to continue';$('#alink').textContent=signup?'I already have an account':'Create an account';$('#pw').autocomplete=signup?'new-password':'current-password';msg('')}
async function authGo(){
  var email=$('#em').value.trim(),password=$('#pw').value;
  if(!email||password.length<8){msg('Enter your email and a password of 8 or more characters.');return}
  $('#abtn').disabled=true;msg('');
  try{
    if(signup){
      var r=await sb.auth.signUp({email:email,password:password,options:{data:{display_name:$('#dn').value.trim()||undefined},emailRedirectTo:location.origin+location.pathname}});
      if(r.error)throw r.error;
      if(!r.data.session){msg('Almost done. Open the email we sent you and tap the confirmation link, then log in.');swap();msg('Almost done. Open the email we sent you and tap the confirmation link, then log in.')}
    }else{
      var r2=await sb.auth.signInWithPassword({email:email,password:password});
      if(r2.error)throw r2.error;
    }
  }catch(e){msg(e.message||'Something went wrong. Try again.')}
  $('#abtn').disabled=false;
}
async function logout(){await sb.auth.signOut()}
sb.auth.onAuthStateChange(function(ev,s){setTimeout(function(){boot(s)},0)});
async function boot(s){
  if(!s){me=null;$('#app').classList.add('hide');$('#auth').classList.remove('hide');return}
  if(me&&me.id===s.user.id)return;
  me=s.user;
  var res=await Promise.all([
    sb.from('profiles').select('*').eq('id',me.id).single(),
    sb.from('follows').select('following_id').eq('follower_id',me.id),
    sb.from('likes').select('post_id,value').eq('user_id',me.id)]);
  prof=res[0].data||{username:'you',display_name:'You',bio:''};
  follows=new Set((res[1].data||[]).map(function(r){return r.following_id}));
  myLikes={};(res[2].data||[]).forEach(function(r){myLikes[r.post_id]=r.value});
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');go('home');
}

/* ---------- navigation ---------- */
document.querySelectorAll('nav [data-t]').forEach(function(b){b.onclick=function(){go(b.dataset.t)}});
function go(t){
  tab=t;
  document.querySelectorAll('nav [data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  window.scrollTo(0,0);
  if(t==='me'){$('#list').classList.add('hide');$('#me').classList.remove('hide');renderMe()}
  else{$('#me').classList.add('hide');$('#list').classList.remove('hide');loadFeed()}
}

/* ---------- feed ---------- */
async function loadFeed(){
  $('#list').innerHTML='<div class="empty">Loading…</div>';
  var q=sb.from('feed').select('*').order('created_at',{ascending:false}).limit(50);
  if(tab==='reel')q=q.in('kind',['reel','video']);
  if(tab==='shop')q=q.eq('kind','product');
  var r=await q;
  if(r.error){$('#list').innerHTML='<div class="empty">Could not load posts. Check your connection and try again.</div>';return}
  posts=r.data||[];renderPosts();
}
function mediaHtml(p){
  var u=p.media_url;if(!u||u.indexOf(SB_URL)!==0)return '';
  var price=p.price_cents!=null?'<span class="price">$'+(p.price_cents/100).toFixed(2)+'</span>':'';
  if(p.kind==='video'||p.kind==='reel')return '<div class="media"><video src="'+esc(u)+'" controls playsinline preload="metadata"></video>'+price+'</div>';
  if(p.kind==='music')return '<div class="media"><audio src="'+esc(u)+'" controls></audio></div>';
  return '<div class="media"><img src="'+esc(u)+'" alt="" loading="lazy">'+price+'</div>';
}
function renderPosts(){
  if(!posts.length){$('#list').innerHTML='<div class="empty">Nothing here yet.<br>Tap <b>+</b> to drop the first post. 🚀</div>';return}
  $('#list').innerHTML=posts.map(function(p,i){
    var mine=p.author_id===me.id,v=myLikes[p.id],name=p.display_name||p.username;
    var priceOnly=(p.kind==='product'&&!p.media_url&&p.price_cents!=null)?'<div class="cap"><b>$'+(p.price_cents/100).toFixed(2)+'</b></div>':'';
    return '<article class="post"><div class="ph"><div class="av">'+esc(name[0]||'?').toUpperCase()+'</div>'+
    '<div class="who"><b>'+esc(name)+(p.is_verified?' ✅':'')+'</b><small>@'+esc(p.username)+'</small></div>'+
    (mine?'':'<button class="pill'+(follows.has(p.author_id)?' on':'')+'" onclick="toggleFollow(\''+p.author_id+'\')">'+(follows.has(p.author_id)?'Following':'Follow')+'</button>')+
    '</div>'+(p.caption?'<p class="cap">'+esc(p.caption)+'</p>':'')+mediaHtml(p)+priceOnly+
    '<div class="act"><button class="'+(v===1?'on':'')+'" onclick="like('+i+',1)">👍 '+(p.like_count||0)+'</button>'+
    '<button class="'+(v===-1?'on':'')+'" onclick="like('+i+',-1)">👎</button>'+
    '<button onclick="openC('+i+')">💬 '+(p.comment_count||0)+'</button>'+
    (mine?'<button onclick="delPost('+i+')">🗑️</button>':'')+
    (p.kind==='product'?'<button class="buy" onclick="toast(\'Checkout is coming soon\')">Buy now</button>':'')+
    '</div></article>'}).join('');
}
async function toggleFollow(uid){
  var has=follows.has(uid),r;
  if(has)r=await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',uid);
  else r=await sb.from('follows').insert({follower_id:me.id,following_id:uid});
  if(r.error){toast('Could not update follow');return}
  if(has)follows.delete(uid);else follows.add(uid);renderPosts();
}
async function like(i,val){
  var p=posts[i],cur=myLikes[p.id],r;
  if(cur===val)r=await sb.from('likes').delete().eq('post_id',p.id).eq('user_id',me.id);
  else r=await sb.from('likes').upsert({post_id:p.id,user_id:me.id,value:val});
  if(r.error){toast('Could not save your reaction');return}
  if(cur===1)p.like_count--;
  if(cur===val)delete myLikes[p.id];else{myLikes[p.id]=val;if(val===1)p.like_count++}
  renderPosts();
}
async function delPost(i){
  if(!confirm('Delete this post?'))return;
  var r=await sb.from('posts').delete().eq('id',posts[i].id);
  if(r.error){toast('Could not delete');return}
  posts.splice(i,1);renderPosts();toast('Post deleted');
}

/* ---------- comments ---------- */
async function openC(i){cpost=i;$('#csheet').classList.add('show');await rc()}
async function rc(){
  $('#clist').innerHTML='<p class="cm mute">Loading…</p>';
  var r=await sb.from('comments').select('body,created_at,profiles(username,display_name)').eq('post_id',posts[cpost].id).order('created_at');
  if(r.error){$('#clist').innerHTML='<p class="cm mute">Could not load comments.</p>';return}
  $('#clist').innerHTML=(r.data||[]).map(function(c){var pr=c.profiles||{};return '<p class="cm"><b>'+esc(pr.display_name||pr.username||'User')+'</b> '+esc(c.body)+'</p>'}).join('')||'<p class="cm mute">No comments yet. Start the conversation.</p>';
}
async function addC(){
  var v=$('#cin').value.trim();if(!v)return;
  var p=posts[cpost],r=await sb.from('comments').insert({post_id:p.id,author_id:me.id,body:v});
  if(r.error){toast('Could not post your comment');return}
  $('#cin').value='';p.comment_count=(p.comment_count||0)+1;await rc();renderPosts();
}

/* ---------- drop ---------- */
function openDrop(){$('#dsheet').classList.add('show')}
function closeSheets(){document.querySelectorAll('.sheet').forEach(function(s){s.classList.remove('show')})}
function kindChange(){$('#dp').classList.toggle('hide',$('#dk').value!=='product')}
async function dropGo(){
  var kind=$('#dk').value,cap=$('#dc').value.trim(),file=$('#df').files[0],price=$('#dp').value;
  var need={photo:'image/',video:'video/',reel:'video/',music:'audio/'}[kind];
  if(kind==='text'&&!cap){toast('Write something first');return}
  if(need&&!file){toast('Choose a file to drop');return}
  if(file&&need&&file.type.indexOf(need)!==0){toast('That file does not match the type you chose');return}
  if(kind==='product'&&(price===''||Number(price)<0)){toast('Enter a price');return}
  if(file&&file.size>50*1024*1024){toast('Files can be up to 50 MB');return}
  var btn=$('#dbtn');btn.disabled=true;btn.textContent='Dropping…';
  try{
    var url=null;
    if(file){
      var ext=(file.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5).toLowerCase()||'bin';
      var path=me.id+'/'+Date.now()+'.'+ext;
      var up=await sb.storage.from('media').upload(path,file,{contentType:file.type});
      if(up.error)throw up.error;
      url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;
    }
    var row={author_id:me.id,kind:kind,caption:cap||null,media_url:url};
    if(kind==='product')row.price_cents=Math.round(Number(price)*100);
    var ins=await sb.from('posts').insert(row);
    if(ins.error)throw ins.error;
    $('#dc').value='';$('#df').value='';$('#dp').value='';closeSheets();toast('Dropped! 🎉');go(tab==='me'?'home':tab);
  }catch(e){toast(e.message||'Could not drop. Try again.')}
  btn.disabled=false;btn.textContent='Drop it';
}

/* ---------- profile ---------- */
async function renderMe(){
  $('#me').innerHTML='<div class="empty">Loading…</div>';
  var c=await Promise.all([
    sb.from('posts').select('*',{count:'exact',head:true}).eq('author_id',me.id),
    sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',me.id),
    sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',me.id)]);
  var name=prof.display_name||prof.username;
  $('#me').innerHTML='<div style="display:flex;gap:12px;align-items:center"><div class="av" style="width:64px;height:64px;font-size:26px">'+esc(name[0]||'?').toUpperCase()+'</div><div><b style="font-size:18px">'+esc(name)+(prof.is_verified?' ✅':'')+'</b><div class="mute">@'+esc(prof.username)+'</div></div></div>'+
  (prof.bio?'<p style="margin-top:10px">'+esc(prof.bio)+'</p>':'')+
  '<div class="stat"><div><b>'+(c[0].count||0)+'</b><small>Posts</small></div><div><b>'+(c[1].count||0)+'</b><small>Followers</small></div><div><b>'+(c[2].count||0)+'</b><small>Following</small></div></div>'+
  '<h3 style="margin:16px 0 8px">Edit profile</h3>'+
  '<input id="pn" class="sb" maxlength="60" placeholder="Name" value="'+esc(prof.display_name||'')+'">'+
  '<input id="pu" class="sb" maxlength="30" placeholder="Username" value="'+esc(prof.username)+'">'+
  '<textarea id="pb" class="sb" rows="3" maxlength="300" placeholder="Bio">'+esc(prof.bio||'')+'</textarea>'+
  '<button class="big" onclick="saveMe()">Save profile</button>'+
  '<h3 style="margin:18px 0 4px">📜 Policies and privacy</h3><p class="mute" style="font-size:12px">Draft summary. A lawyer should review it before public launch.</p>'+
  '<details><summary>🔐 Privacy</summary><p>We collect what you give us (email, profile, posts, orders) and basic app usage. We never sell your personal data.</p></details>'+
  '<details><summary>🤝 Community rules</summary><p>No hate, harassment, threats, scams, violence or sexual content involving minors. Repeat violations end accounts.</p></details>'+
  '<details><summary>🛍️ Seller rules</summary><p>List only real items you can deliver. No illegal, counterfeit or dangerous goods.</p></details>'+
  '<button class="big" style="background:none;color:var(--ink);border:1.5px solid var(--ink);margin-top:18px" onclick="logout()">Log out</button>';
}
async function saveMe(){
  var u=$('#pu').value.trim().toLowerCase();
  if(!/^[a-z0-9_]{3,30}$/.test(u)){toast('Username: 3 to 30 letters, numbers or _');return}
  var upd={display_name:$('#pn').value.trim()||null,username:u,bio:$('#pb').value.trim()||null};
  var r=await sb.from('profiles').update(upd).eq('id',me.id);
  if(r.error){toast(r.error.code==='23505'?'That username is taken':'Could not save');return}
  prof=Object.assign(prof,upd);toast('Profile saved ✅');renderMe();
}
</script>
</body>
</html>
